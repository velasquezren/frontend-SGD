<div class="ui-page-header">
  <h1 class="ui-page-title">Mi perfil</h1>
</div>

@if (user(); as u) {
  <div class="ui-panel ui-panel--padded ui-panel--form-wide profile-page__summary">
    <dl class="ui-profile-summary">
      <div>
        <dt>Nombre</dt>
        <dd>{{ u.firstName }} {{ u.lastName }}</dd>
      </div>
      <div>
        <dt>Correo</dt>
        <dd>{{ u.email }}</dd>
      </div>
      <div>
        <dt>Rol</dt>
        <dd>{{ roleLabel(u.role) }}</dd>
      </div>
    </dl>
  </div>
}

<div class="ui-panel ui-panel--padded ui-panel--form-wide">
  <h2 class="ui-section-title">Cambiar contraseña</h2>

  @if (serverError(); as message) {
    <p class="ui-form-error" role="alert">{{ message }}</p>
  }

  <form class="ui-form" (submit)="onSubmit(); $event.preventDefault()" novalidate>
    <ui-field
      for="currentPassword"
      label="Contraseña actual"
      [invalid]="passwordForm.currentPassword().touched() && passwordForm.currentPassword().invalid()"
      [error]="fieldError(passwordForm.currentPassword())"
    >
      <input
        id="currentPassword"
        type="password"
        class="ui-input"
        autocomplete="current-password"
        [formField]="passwordForm.currentPassword"
      />
    </ui-field>

    <ui-field
      for="newPassword"
      label="Nueva contraseña"
      hint="Mínimo 8 caracteres."
      [invalid]="passwordForm.newPassword().touched() && passwordForm.newPassword().invalid()"
      [error]="fieldError(passwordForm.newPassword())"
    >
      <input
        id="newPassword"
        type="password"
        class="ui-input"
        autocomplete="new-password"
        [formField]="passwordForm.newPassword"
      />
    </ui-field>

    <ui-field
      for="confirmPassword"
      label="Confirmar nueva contraseña"
      [invalid]="passwordForm.confirmPassword().touched() && passwordForm.confirmPassword().invalid()"
      [error]="fieldError(passwordForm.confirmPassword())"
    >
      <input
        id="confirmPassword"
        type="password"
        class="ui-input"
        autocomplete="new-password"
        [formField]="passwordForm.confirmPassword"
      />
    </ui-field>

    <div class="ui-form-actions">
      <ui-button type="submit" [loading]="submitting()" [disabled]="passwordForm().invalid()">
        Cambiar contraseña
      </ui-button>
    </div>
  </form>
</div>
